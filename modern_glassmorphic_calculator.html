<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glassmorphic Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1c29, #0d0e15 70%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
            transform: translateY(-2px);
        }
        .glass-btn:active {
            transform: translateY(0);
        }
        .neon-glow-purple {
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
        }
        .neon-glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }
        /* Custom scrollbar for history */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-white flex items-center justify-center p-2 sm:p-6 min-h-screen">

    <!-- Background glowing ambient shapes -->
    <div class="absolute top-10 left-10 w-72 h-72 bg-purple-600/20 rounded-full filter blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-80 h-80 bg-cyan-600/20 rounded-full filter blur-[120px] pointer-events-none"></div>

    <div id="app" class="w-full max-w-4xl mx-auto flex flex-col lg:flex-row gap-6 items-center justify-center relative z-10">
        
        <!-- Calculator Card -->
        <div id="calculator-card" class="glass-panel w-full max-w-md rounded-3xl p-6 sm:p-8 flex flex-col transition-all duration-300">
            
            <!-- Top Controls Bar -->
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center space-x-2">
                    <span class="w-3 h-3 rounded-full bg-rose-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-amber-500/80 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500/80 inline-block"></span>
                    <span class="text-xs font-semibold text-gray-400 tracking-wider ml-2 uppercase" id="mode-indicator">Standard</span>
                </div>
                
                <div class="flex items-center space-x-3">
                    <!-- Sound Toggle -->
                    <button id="sound-toggle" title="Toggle Sound" class="glass-btn p-2 rounded-xl text-gray-300 hover:text-white transition">
                        <i data-lucide="volume-2" class="w-4 h-4" id="sound-icon"></i>
                    </button>
                    <!-- History Toggle Button (Mobile) -->
                    <button id="history-toggle-btn" title="Toggle History" class="glass-btn lg:hidden p-2 rounded-xl text-gray-300 hover:text-white transition">
                        <i data-lucide="history" class="w-4 h-4"></i>
                    </button>
                    <!-- Mode Toggle Button -->
                    <button id="mode-toggle-btn" class="glass-btn px-3 py-1.5 rounded-xl text-xs font-medium text-purple-300 hover:text-purple-200 border-purple-500/30 flex items-center space-x-1.5 transition">
                        <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                        <span id="mode-btn-text">Scientific</span>
                    </button>
                </div>
            </div>

            <!-- Display Screen -->
            <div class="glass-panel rounded-2xl p-4 mb-6 flex flex-col justify-end text-right border border-white/10 relative overflow-hidden">
                <!-- Memory Indicator Badge -->
                <div id="memory-badge" class="absolute top-2 left-3 text-[10px] uppercase font-bold tracking-widest text-cyan-400 opacity-0 transition-opacity duration-300">
                    M: <span id="memory-val">0</span>
                </div>
                <!-- Previous Expression -->
                <div id="previous-expression" class="text-gray-400 text-sm h-6 overflow-x-auto whitespace-nowrap tracking-wide"></div>
                <!-- Current Input -->
                <div id="current-display" class="text-3xl sm:text-4xl font-bold tracking-tight text-white overflow-x-auto whitespace-nowrap mt-1">0</div>
            </div>

            <!-- Keypad Area -->
            <div id="keypad-container" class="grid grid-cols-4 gap-3">
                <!-- Buttons will be dynamically injected or rendered depending on mode -->
            </div>
        </div>

        <!-- History Panel (Desktop sidebar or sliding drawer) -->
        <div id="history-panel" class="glass-panel w-full max-w-sm lg:w-80 rounded-3xl p-6 flex flex-col h-[520px] transition-all duration-300 hidden lg:flex">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/10">
                <div class="flex items-center space-x-2 text-purple-300">
                    <i data-lucide="history" class="w-5 h-5"></i>
                    <h3 class="font-semibold text-sm tracking-wide uppercase">Calculation History</h3>
                </div>
                <button id="clear-history-btn" title="Clear History" class="text-xs text-gray-400 hover:text-rose-400 transition flex items-center space-x-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>Clear</span>
                </button>
            </div>
            
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <div class="text-center text-gray-500 text-sm py-12 flex flex-col items-center justify-center space-y-2">
                    <i data-lucide="clock" class="w-8 h-8 opacity-40"></i>
                    <p>No history yet</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Audio synthesizer using Web Audio API for satisfying click feedback
        let soundEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playClickSound(type = 'normal') {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type === 'operator' ? 'sine' : type === 'equals' ? 'triangle' : 'sine';
            osc.frequency.setValueAtTime(type === 'operator' ? 440 : type === 'equals' ? 600 : 320, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        // Calculator State
        let currentMode = 'standard'; // 'standard' or 'scientific'
        let currentInput = '0';
        let previousExpression = '';
        let memory = 0;
        let history = [];
        let resetNext = false;
        let isRadians = true; // For trig functions

        // DOM Elements
        const currentDisplayEl = document.getElementById('current-display');
        const previousExpressionEl = document.getElementById('previous-expression');
        const modeIndicatorEl = document.getElementById('mode-indicator');
        const modeBtnTextEl = document.getElementById('mode-btn-text');
        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIconEl = document.getElementById('sound-icon');
        const keypadContainer = document.getElementById('keypad-container');
        const calculatorCard = document.getElementById('calculator-card');
        const historyPanel = document.getElementById('history-panel');
        const historyListEl = document.getElementById('history-list');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const historyToggleBtn = document.getElementById('history-toggle-btn');
        const memoryBadgeEl = document.getElementById('memory-badge');
        const memoryValEl = document.getElementById('memory-val');

        // Button Layout Configurations
        const standardButtons = [
            { label: 'MC', type: 'memory', action: 'mc', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'MR', type: 'memory', action: 'mr', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'M+', type: 'memory', action: 'm+', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'M-', type: 'memory', action: 'm-', class: 'text-cyan-400 text-xs font-semibold' },
            
            { label: 'C', type: 'clear', action: 'clear', class: 'text-rose-400 font-semibold' },
            { label: '(', type: 'operator', action: '(', class: 'text-purple-300' },
            { label: ')', type: 'operator', action: ')', class: 'text-purple-300' },
            { label: '÷', type: 'operator', action: '/', class: 'text-purple-400 font-semibold' },
            
            { label: '7', type: 'number', action: '7', class: 'text-white font-medium' },
            { label: '8', type: 'number', action: '8', class: 'text-white font-medium' },
            { label: '9', type: 'number', action: '9', class: 'text-white font-medium' },
            { label: '×', type: 'operator', action: '*', class: 'text-purple-400 font-semibold' },
            
            { label: '4', type: 'number', action: '4', class: 'text-white font-medium' },
            { label: '5', type: 'number', action: '5', class: 'text-white font-medium' },
            { label: '6', type: 'number', action: '6', class: 'text-white font-medium' },
            { label: '-', type: 'operator', action: '-', class: 'text-purple-400 font-semibold' },
            
            { label: '1', type: 'number', action: '1', class: 'text-white font-medium' },
            { label: '2', type: 'number', action: '2', class: 'text-white font-medium' },
            { label: '3', type: 'number', action: '3', class: 'text-white font-medium' },
            { label: '+', type: 'operator', action: '+', class: 'text-purple-400 font-semibold' },
            
            { label: '±', type: 'action', action: 'negate', class: 'text-gray-300' },
            { label: '0', type: 'number', action: '0', class: 'text-white font-medium' },
            { label: '.', type: 'number', action: '.', class: 'text-white font-medium' },
            { label: '=', type: 'equals', action: 'equals', class: 'bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold neon-glow-purple' }
        ];

        const scientificButtons = [
            { label: 'Rad/Deg', type: 'action', action: 'angle-toggle', class: 'text-amber-300 text-xs font-semibold' },
            { label: 'sin', type: 'func', action: 'sin', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'cos', type: 'func', action: 'cos', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'tan', type: 'func', action: 'tan', class: 'text-cyan-300 text-xs font-semibold' },
            
            { label: 'log', type: 'func', action: 'log', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'ln', type: 'func', action: 'ln', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'x²', type: 'func', action: 'square', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'x^y', type: 'operator', action: '^', class: 'text-cyan-300 text-xs font-semibold' },
            
            { label: '√', type: 'func', action: 'sqrt', class: 'text-cyan-300 text-xs font-semibold' },
            { label: 'π', type: 'constant', action: 'pi', class: 'text-amber-300 font-semibold' },
            { label: 'e', type: 'constant', action: 'e', class: 'text-amber-300 font-semibold' },
            { label: '%', type: 'operator', action: '%', class: 'text-purple-400 font-semibold' },
            
            { label: 'MC', type: 'memory', action: 'mc', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'MR', type: 'memory', action: 'mr', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'M+', type: 'memory', action: 'm+', class: 'text-cyan-400 text-xs font-semibold' },
            { label: 'M-', type: 'memory', action: 'm-', class: 'text-cyan-400 text-xs font-semibold' },
            
            { label: 'C', type: 'clear', action: 'clear', class: 'text-rose-400 font-semibold' },
            { label: '(', type: 'operator', action: '(', class: 'text-purple-300' },
            { label: ')', type: 'operator', action: ')', class: 'text-purple-300' },
            { label: '÷', type: 'operator', action: '/', class: 'text-purple-400 font-semibold' },
            
            { label: '7', type: 'number', action: '7', class: 'text-white font-medium' },
            { label: '8', type: 'number', action: '8', class: 'text-white font-medium' },
            { label: '9', type: 'number', action: '9', class: 'text-white font-medium' },
            { label: '×', type: 'operator', action: '*', class: 'text-purple-400 font-semibold' },
            
            { label: '4', type: 'number', action: '4', class: 'text-white font-medium' },
            { label: '5', type: 'number', action: '5', class: 'text-white font-medium' },
            { label: '6', type: 'number', action: '6', class: 'text-white font-medium' },
            { label: '-', type: 'operator', action: '-', class: 'text-purple-400 font-semibold' },
            
            { label: '1', type: 'number', action: '1', class: 'text-white font-medium' },
            { label: '2', type: 'number', action: '2', class: 'text-white font-medium' },
            { label: '3', type: 'number', action: '3', class: 'text-white font-medium' },
            { label: '+', type: 'operator', action: '+', class: 'text-purple-400 font-semibold' },
            
            { label: '±', type: 'action', action: 'negate', class: 'text-gray-300' },
            { label: '0', type: 'number', action: '0', class: 'text-white font-medium' },
            { label: '.', type: 'number', action: '.', class: 'text-white font-medium' },
            { label: '=', type: 'equals', action: 'equals', class: 'bg-gradient-to-r from-purple-600 to-cyan-500 text-white font-bold neon-glow-purple' }
        ];

        function renderKeypad() {
            keypadContainer.innerHTML = '';
            const buttons = currentMode === 'scientific' ? scientificButtons : standardButtons;
            
            // Adjust grid columns depending on mode
            if (currentMode === 'scientific') {
                keypadContainer.className = 'grid grid-cols-4 gap-2.5 sm:gap-3';
                calculatorCard.classList.remove('max-w-md');
                calculatorCard.classList.add('max-w-lg');
            } else {
                keypadContainer.className = 'grid grid-cols-4 gap-3';
                calculatorCard.classList.remove('max-w-lg');
                calculatorCard.classList.add('max-w-md');
            }

            buttons.forEach(btn => {
                const buttonEl = document.createElement('button');
                buttonEl.className = `glass-btn py-3.5 sm:py-4 rounded-2xl flex items-center justify-center text-base sm:text-lg transition active:scale-95 ${btn.class}`;
                buttonEl.textContent = btn.label;
                buttonEl.setAttribute('data-action', btn.action);
                buttonEl.setAttribute('data-type', btn.type);
                
                buttonEl.addEventListener('click', () => handleButtonPress(btn));
                keypadContainer.appendChild(buttonEl);
            });
        }

        function handleButtonPress(btn) {
            const { type, action, label } = btn;
            
            if (type === 'number') {
                playClickSound('normal');
                if (resetNext) {
                    currentInput = action;
                    resetNext = false;
                } else {
                    if (currentInput === '0' && action !== '.') {
                        currentInput = action;
                    } else if (action === '.' && currentInput.includes('.')) {
                        return;
                    } else {
                        currentInput += action;
                    }
                }
            } 
            else if (type === 'operator') {
                playClickSound('operator');
                if (action === '%') {
                    calculatePercentage();
                    return;
                }
                const opSymbol = label;
                previousExpression += ` ${currentInput} ${opSymbol}`;
                // Replace visual operators with JS operators for safe evaluation later
                const jsOp = action === '÷' ? '/' : action === '×' ? '*' : action;
                currentInput = '0';
                resetNext = false;
            } 
            else if (type === 'clear') {
                playClickSound('operator');
                if (action === 'clear') {
                    currentInput = '0';
                    previousExpression = '';
                    resetNext = false;
                }
            } 
            else if (type === 'equals') {
                playClickSound('equals');
                evaluateExpression();
            } 
            else if (type === 'memory') {
                playClickSound('normal');
                handleMemory(action);
            } 
            else if (type === 'func') {
                playClickSound('operator');
                handleScientificFunction(action);
            } 
            else if (type === 'constant') {
                playClickSound('normal');
                if (action === 'pi') currentInput = Math.PI.toString();
                if (action === 'e') currentInput = Math.E.toString();
                resetNext = true;
            } 
            else if (type === 'action') {
                playClickSound('normal');
                if (action === 'negate') {
                    if (currentInput.startsWith('-')) {
                        currentInput = currentInput.slice(1);
                    } else if (currentInput !== '0') {
                        currentInput = '-' + currentInput;
                    }
                } else if (action === 'angle-toggle') {
                    isRadians = !isRadians;
                    btn.label = isRadians ? 'Rad/Deg' : 'Deg/Rad';
                    renderKeypad();
                }
            }

            updateDisplay();
        }

        function handleMemory(action) {
            const val = parseFloat(currentInput) || 0;
            switch(action) {
                case 'mc':
                    memory = 0;
                    break;
                case 'mr':
                    currentInput = memory.toString();
                    resetNext = true;
                    break;
                case 'm+':
                    memory += val;
                    break;
                case 'm-':
                    memory -= val;
                    break;
            }
            
            if (memory !== 0) {
                memoryBadgeEl.style.opacity = '1';
                memoryValEl.textContent = memory;
            } else {
                memoryBadgeEl.style.opacity = '0';
            }
        }

        function handleScientificFunction(func) {
            let val = parseFloat(currentInput) || 0;
            let result = 0;
            let exprLabel = '';

            switch(func) {
                case 'sin':
                    let angleSin = isRadians ? val : (val * Math.PI / 180);
                    result = Math.sin(angleSin);
                    exprLabel = `sin(${val})`;
                    break;
                case 'cos':
                    let angleCos = isRadians ? val : (val * Math.PI / 180);
                    result = Math.cos(angleCos);
                    exprLabel = `cos(${val})`;
                    break;
                case 'tan':
                    let angleTan = isRadians ? val : (val * Math.PI / 180);
                    result = Math.tan(angleTan);
                    exprLabel = `tan(${val})`;
                    break;
                case 'log':
                    result = Math.log10(val);
                    exprLabel = `log(${val})`;
                    break;
                case 'ln':
                    result = Math.log(val);
                    exprLabel = `ln(${val})`;
                    break;
                case 'square':
                    result = Math.pow(val, 2);
                    exprLabel = `sqr(${val})`;
                    break;
                case 'sqrt':
                    result = Math.sqrt(val);
                    exprLabel = `√(${val})`;
                    break;
            }

            if (isNaN(result) || !isFinite(result)) {
                currentInput = 'Error';
            } else {
                // Round to avoid floating point precision noise
                currentInput = parseFloat(result.toFixed(10)).toString();
            }
            
            previousExpression = exprLabel;
            resetNext = true;
            addToHistory(exprLabel, currentInput);
        }

        function calculatePercentage() {
            let val = parseFloat(currentInput) || 0;
            let result = val / 100;
            currentInput = result.toString();
            resetNext = true;
        }

        function evaluateExpression() {
            try {
                let fullExpr = previousExpression ? `${previousExpression} ${currentInput}` : currentInput;
                // Sanitize symbols for evaluation
                let sanitized = fullExpr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/\^/g, '**');

                // Evaluate safely
                let evalResult = Function(`'use strict'; return (${sanitized})`)();
                
                if (isNaN(evalResult) || !isFinite(evalResult)) {
                    throw new Error('Invalid calculation');
                }

                let formattedResult = parseFloat(evalResult.toFixed(10)).toString();
                
                addToHistory(fullExpr, formattedResult);
                
                previousExpression = fullExpr + ' =';
                currentInput = formattedResult;
                resetNext = true;
            } catch (err) {
                currentInput = 'Error';
                resetNext = true;
            }
        }

        function addToHistory(expr, result) {
            history.unshift({ expr, result, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}) });
            if (history.length > 20) history.pop();
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyListEl.innerHTML = `
                    <div class="text-center text-gray-500 text-sm py-12 flex flex-col items-center justify-center space-y-2">
                        <i data-lucide="clock" class="w-8 h-8 opacity-40"></i>
                        <p>No history yet</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            historyListEl.innerHTML = '';
            history.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'glass-panel p-3 rounded-2xl hover:bg-white/10 cursor-pointer transition flex flex-col space-y-1 group border border-white/5';
                itemEl.innerHTML = `
                    <div class="flex justify-between items-center text-xs text-gray-400">
                        <span>${item.expr}</span>
                        <span class="opacity-0 group-hover:opacity-100 transition text-cyan-400 font-medium">Reuse</span>
                    </div>
                    <div class="text-lg font-bold text-white tracking-wide">= ${item.result}</div>
                `;
                itemEl.addEventListener('click', () => {
                    playClickSound('normal');
                    currentInput = item.result;
                    resetNext = true;
                    updateDisplay();
                });
                historyListEl.appendChild(itemEl);
            });
        }

        function updateDisplay() {
            currentDisplayEl.textContent = currentInput;
            previousExpressionEl.textContent = previousExpression;
        }

        // Mode toggle listener
        modeToggleBtn.addEventListener('click', () => {
            playClickSound('operator');
            currentMode = currentMode === 'standard' ? 'scientific' : 'standard';
            modeIndicatorEl.textContent = currentMode;
            modeBtnTextEl.textContent = currentMode === 'standard' ? 'Scientific' : 'Standard';
            renderKeypad();
        });

        // Sound toggle listener
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIconEl.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
            lucide.createIcons();
        });

        // History mobile drawer toggle
        historyToggleBtn.addEventListener('click', () => {
            historyPanel.classList.toggle('hidden');
            historyPanel.classList.toggle('absolute');
            historyPanel.classList.toggle('z-50');
            historyPanel.classList.toggle('bg-[#141520]/95');
        });

        clearHistoryBtn.addEventListener('click', () => {
            playClickSound('operator');
            history = [];
            renderHistory();
        });

        // Full keyboard support
        window.addEventListener('keydown', (e) => {
            if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
                simulateButtonPress(e.key);
            } else if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/' || e.key === '%') {
                simulateButtonPress(e.key);
            } else if (e.key === 'Enter' || e.key === '=') {
                e.preventDefault();
                simulateButtonPress('equals');
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                if (currentInput.length > 1) {
                    currentInput = currentInput.slice(0, -1);
                } else {
                    currentInput = '0';
                }
                updateDisplay();
                playClickSound('normal');
            } else if (e.key === 'Escape') {
                simulateButtonPress('clear');
            } else if (e.key === '(' || e.key === ')') {
                simulateButtonPress(e.key);
            }
        });

        function simulateButtonPress(actionKey) {
            const buttons = currentMode === 'scientific' ? scientificButtons : standardButtons;
            const target = buttons.find(b => b.action === actionKey || b.label === actionKey);
            if (target) {
                // Find matching button element in DOM and animate/click it
                const btnEl = Array.from(keypadContainer.children).find(el => el.getAttribute('data-action') === target.action);
                if (btnEl) {
                    btnEl.classList.add('scale-95', 'bg-white/20');
                    setTimeout(() => btnEl.classList.remove('scale-95', 'bg-white/20'), 150);
                }
                handleButtonPress(target);
            }
        }

        // Initial render
        renderKeypad();
    </script>
</body>
</html>
